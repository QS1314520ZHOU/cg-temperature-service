# 体征推送配置
vitalsign:
  push:
    url: ${VITALSIGN_PUSH_URL:http://10.35.4.101:8813/NIS_SE/mcs-ws/EwellInterfaceService}
    # 推送兜底：扫描/汇总后已立即推送，此为安全网（处理异常未推送的记录）
    cron: ${VITALSIGN_PUSH_CRON:0 */10 * * * ?}
    connection-timeout: 10000
    read-timeout: 30000
    enabled: true
    max-retry-count: 3
    max-request-body-length: 4000
    max-response-body-length: 2000
    # 每批拉取条数（默认50）
    batch-size: ${VITALSIGN_PUSH_BATCH_SIZE:50}
    # 单次pushOnce最大处理条数（安全上限，防止无限循环，默认200）
    max-records-per-run: ${VITALSIGN_PUSH_MAX_RECORDS_PER_RUN:200}
  # 普通体征扫描配置
  scan:
    # 活跃时段回看窗口（小时）：02/06/10/14/18/22点每3分钟执行
    lookback-hours: ${VITALSIGN_SCAN_LOOKBACK_HOURS:14}
    # 非活跃时段回看窗口（小时）：其他时间每30分钟执行
    inactive-lookback-hours: ${VITALSIGN_SCAN_INACTIVE_LOOKBACK_HOURS:168}
    # 血压 07:00 槽位回看天数
    bp-lookback-days: ${VITALSIGN_SCAN_BP_LOOKBACK_DAYS:7}
    # 入科首条回传回看天数
    admission-lookback-days: ${VITALSIGN_SCAN_ADMISSION_LOOKBACK_DAYS:1}
  # 呼吸机事件检测开关
  # true（默认）= 检测呼吸机启用/停止事件并推送
  # false = 禁用呼吸机事件检测
  ventilator-detect-enabled: ${VITALSIGN_VENTILATOR_DETECT_ENABLED:false}
  # 体温复测巡检配置
  recheck:
    # 复测巡检回望窗口（小时），默认 24 小时；可用环境变量 VITALSIGN_RECHECK_LOOKBACK_HOURS 覆盖
    lookback-hours: ${VITALSIGN_RECHECK_LOOKBACK_HOURS:24}
  # 出科患者回传配置
  discharge:
    # 出科回传cron表达式：每10分钟执行一次
    cron: ${VITALSIGN_DISCHARGE_CRON:0 */10 * * * ?}
    # 出科回传回看小时数：查询最近24小时内出科的患者
    lookback-hours: ${VITALSIGN_DISCHARGE_LOOKBACK_HOURS:24}
  # 每日汇总配置
  summary:
    # 7-8点每5分钟执行一次汇总（只处理昨天的出入量）
    cron: ${VITALSIGN_SUMMARY_CRON:0 0/5 7 * * ?}
    # 变化检测：8点之后每30分钟检查数据是否变化，变化则撤销重发（08:00~23:30, 00:00~06:30）
    check-cron: ${VITALSIGN_SUMMARY_CHECK_CRON:0 0/30 8-23,0-6 * * ?}
    # 汇总回看天数（报表日）
    lookback-days: ${VITALSIGN_SUMMARY_LOOKBACK_DAYS:1}
    # 变化检测回看天数：检测最近N天的数据变化，默认2天（昨天+前天）
    check-lookback-days: ${VITALSIGN_SUMMARY_CHECK_LOOKBACK_DAYS:7}
  patient:
    patient-id-source: ${VITALSIGN_PATIENT_ID_SOURCE:mrn}
    mrn-source: ${VITALSIGN_MRN_SOURCE:hisPid}
    series: ${VITALSIGN_SERIES:1}
    ward-code: ${VITALSIGN_WARD_CODE:125011}
    record-nurse-id: ${VITALSIGN_RECORD_NURSE_ID:041660}
  # 身高体重单位配置
  height-weight:
    height-unit: ${VITALSIGN_HEIGHT_UNIT:cm}
    weight-unit: ${VITALSIGN_WEIGHT_UNIT:ml}
  # 自动回传总开关
  # false = 所有定时任务只登记不执行，仅允许通过 Swagger 手动触发
  # true（默认）= 恢复定时自动采集与推送
  auto-enabled: ${VITALSIGN_AUTO_ENABLED:true}
  # 手动触发接口开关：生产稳定后建议关掉
  manual:
    enabled: ${VITALSIGN_MANUAL_ENABLED:true}

digixmed:
  url: http://10.35.4.101:8813/NIS_SE/mcs-ws/EwellInterfaceService
  debug: false
  isUpload: true
  testPid: all
  rcron: 0 0/2 * * * ?
  # 生命体征扫描：活跃时段(02/06/10/14/18/22点)每3分钟执行(:03~:30)，其他时段每30分钟执行(:00/:30)
  cron: 0 */3 * * * ?
  deleteDay: 180
  backDay: 1
  timePointasd: 7

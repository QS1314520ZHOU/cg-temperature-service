spring:
  application:
    name: CGTemperatureService
  cloud:
    nacos:
      config:
        server-addr: localhost:50001
        file-extension: yml
      discovery:
        heart-beat-timeout: 1000
        heart-beat-interval: 1000
      server-addr: localhost:50001
  data:
    mongodb:
      uri: ${MONGODB_URI}
  profiles:
    active: PRD

server:
  port: 10245

# KingbaseES配置（用于查询在科患者）
kingbase:
  url: ${KINGBASE_URL:}
  username: ${KINGBASE_USERNAME:}
  password: ${KINGBASE_PASSWORD:}
  schema: ${KINGBASE_SCHEMA:np_nis_cqchonggang}

# 体征推送配置
vitalsign:
  push:
    url: ${VITALSIGN_PUSH_URL:http://10.35.4.101:8813/NIS_SE/mcs-ws/EwellInterfaceService}
    connection-timeout: 10000
    read-timeout: 30000
    enabled: true
    max-retry-count: 3
    max-request-body-length: 4000
    max-response-body-length: 2000
  patient:
    patient-id-source: ${VITALSIGN_PATIENT_ID_SOURCE:mrn}
    mrn-source: ${VITALSIGN_MRN_SOURCE:hisPid}
    series: ${VITALSIGN_SERIES:1}
    ward-code: ${VITALSIGN_WARD_CODE:125011}
    record-nurse-id: ${VITALSIGN_RECORD_NURSE_ID:dba}

digixmed:
  debug: false
  isUpload: true
  testPid: all
  rcron: 0 0/2 * * * ?
  cron: 0 0/1 * * * ?
  deleteDay: 180
  backDay: 1
  timePointasd: 7